# Render blueprint — backend (FastAPI on Docker) using Supabase Postgres.
# Deploy: Render dashboard -> "Blueprints" -> connect this repo -> "Sync".
# The frontend deploys separately on Vercel — its URL MUST be listed in
# CORS_ORIGINS below (update it once the Vercel domain is known).
#
# On boot the container runs scripts/init_db.py (idempotent tables + views)
# and scripts/seed.py (demo dataset; skipped when already present), then
# serves uvicorn on $PORT. Health check: GET /health.

services:
  - type: web
    name: apaar-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      # Set this in Render to the Supabase shared Transaction pooler URI.
      # It must use aws-*.pooler.supabase.com:6543 and the project-qualified
      # username postgres.<project-ref>; db.<project-ref>.supabase.co is IPv6.
      # Keep the password URL-encoded and never commit the value.
      - key: DATABASE_URL
        sync: false
      # auto-generated once and kept stable across deploys
      - key: JWT_SECRET
        generateValue: true
      # MUST include the Vercel domain of the deployed frontend, e.g.
      # https://apaar-setu.vercel.app — otherwise the browser blocks API calls
      - key: CORS_ORIGINS
        value: https://apaar-setu.vercel.app,http://localhost:5173
      - key: LLM_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_KEY
        sync: false
      - key: SIGNING_PRIVATE_KEY
        sync: false
